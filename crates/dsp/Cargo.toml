[package]
name        = "family-dsp"
description = "DSP shared by the family's plugins: the crossover, the audited conversions, the click statistic, turning the host's input into a DI, and the reported latency."
version     = "0.1.0"
edition.workspace    = true
publish.workspace    = true
repository.workspace = true

[dependencies]
libm = "0.2.16"
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.12.0"

[features]
serde = ["dep:serde"]

[lints]
workspace = true
