[package]
name        = "family-wav"
description = "WAV reading and writing for the family's offline tools, the stats, split, join and signal commands, and loading a plugin's tuning."
version     = "0.1.0"
edition.workspace    = true
publish.workspace    = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
family-dsp = { path = "../dsp" }
family-signals = { path = "../signals" }
hound = "3.5.1"
serde = "1.0.229"
toml = "1.1.8"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"

[lints]
workspace = true

[[bin]]
name = "wav"
path = "src/main.rs"
