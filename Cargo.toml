[workspace]
members  = ["crates/dsp", "crates/signals", "crates/ui", "crates/wav", "crates/xtask"]
resolver = "3"

[workspace.package]
edition    = "2024"
publish    = false
repository = "https://github.com/iuri-audio/family"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
assertions_on_result_states     = "warn"
dbg_macro                       = "warn"
get_unwrap                      = "warn"
indexing_slicing                = "warn"
let_underscore_must_use         = "warn"
map_err_ignore                  = "warn"
mem_forget                      = "warn"
multiple_unsafe_ops_per_block   = "warn"
nursery                         = { level = "warn", priority = -1 }
panic                           = "warn"
panic_in_result_fn              = "warn"
pedantic                        = { level = "warn", priority = -1 }
print_stderr                    = "warn"
print_stdout                    = "warn"
todo                            = "warn"
undocumented_unsafe_blocks      = "warn"
unimplemented                   = "warn"
unreachable                     = "warn"
unused_result_ok                = "warn"
unwrap_used                     = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unnameable_types              = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Line tables only: backtraces through dependencies keep their file and line, without the size
# and memory of full debug info (nobody steps into dependencies with a debugger).
debug = "line-tables-only"
